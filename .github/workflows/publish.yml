name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: vekgram

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Generate API
        run: |
          uv run python3 compiler/errors/compiler.py
          cd compiler/api && uv run python3 compiler.py

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        run: uv publish dist/*
